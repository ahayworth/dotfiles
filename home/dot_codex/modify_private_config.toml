{{- /* chezmoi:modify-template */ -}}
{{- $config := .chezmoi.stdin | fromToml -}}
{{- $config = $config | setValueAtPath "model" .codex.config.model -}}
{{- $config = $config | setValueAtPath "model_reasoning_effort" .codex.config.model_reasoning_effort -}}
{{- $config = $config | setValueAtPath "plan_mode_reasoning_effort" .codex.config.plan_mode_reasoning_effort -}}
{{- $config = $config | setValueAtPath "approval_policy" .codex.config.approval_policy -}}
{{- $config = $config | setValueAtPath "approvals_reviewer" .codex.config.approvals_reviewer -}}
{{- $config = $config | setValueAtPath "sandbox_mode" .codex.config.sandbox_mode -}}
{{- $config = $config | setValueAtPath "suppress_unstable_features_warning" .codex.config.suppress_unstable_features_warning -}}
{{- range $name, $value := .codex.config.features -}}
{{- $config = $config | setValueAtPath (list "features" $name) $value -}}
{{- end -}}
{{- $config = $config | setValueAtPath (list "tui" "keymap" "editor" "insert_newline") .codex.config.tui.keymap.editor.insert_newline -}}
{{- range .codex.plugins.ensure -}}
{{- $config = $config | setValueAtPath (list "plugins" . "enabled") true -}}
{{- end -}}
{{- $config = $config | deleteValueAtPath "features.js_repl" -}}
{{ $config | toToml -}}
